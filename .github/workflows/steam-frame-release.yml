# The Steam Frame release: the files of a PrimedFrame GitHub release are built here, from the tagged source,
# never on a desktop. steam-frame/ci-build.sh does the work (see it for the stages); release.sh's checks
# (check-bundle against every SteamOS build, the audit, the glibc 2.39 loader tests, the launcher on Qt's
# offscreen platform) must all pass or there is nothing to upload.
#   push to release/**, or run by hand: build and check, upload the files as a workflow artifact (a trial)
#   push a tag v*: the same, then a DRAFT release for the tag with the four files and CHANGELOG-<version>.md as
#                  its text. Publishing it (and making it the latest) is done by hand after checking the draft.
name: steam-frame-release

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-frame-release-${{ github.ref }}
  # a newer push to a release branch replaces its trial; a tag's run is never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # Ubuntu 24.04 has glibc 2.39, the oldest SteamOS's, so the programs are built natively for it.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      PF_CI_WORK: ${{ github.workspace }}/build-ci
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the version string is `git describe`; it needs the tags.
          fetch-depth: 0
      - name: Version
        id: version
        run: |
          v=$(head -n 1 steam-frame/VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "PrimedFrame $v ($GITHUB_REF_NAME, $(git describe --tags --always))"
          if [[ $GITHUB_REF == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match steam-frame/VERSION ($v)"; exit 1
          fi
      - name: Dependencies
        run: steam-frame/ci-build.sh deps
      - name: Compiler versions
        id: compilers
        run: echo "clang=$(clang --version | head -n 1 | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ci/qt
          key: qt-6.10.3-linux-arm64-${{ hashFiles('steam-frame/ci-build.sh') }}
          restore-keys: qt-6.10.3-linux-arm64-
      - name: Qt
        run: steam-frame/ci-build.sh qt
      - name: Qt and ICU licence texts
        run: steam-frame/ci-build.sh licenses
      # Dawn takes the longest; only its package is kept (build-linux-dawn.sh reuses it when every input matches).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build-ci/dawn/dawn-package.txt
            build-ci/dawn/dawn-linux-*-primedgun-*.tar.gz
          key: dawn-linux-arm64-${{ steps.compilers.outputs.clang }}-${{ hashFiles('tools/build-linux-dawn.sh', 'quest/dawn/**', 'extern/aurora/include/aurora/dawn_*_abi.h', 'extern/aurora/cmake/AuroraDependencyVersions.cmake') }}
      - name: Dawn
        run: |
          steam-frame/ci-build.sh dawn
          # the Dawn sources and build tree are not needed past this point
          rm -rf build-ci/dawn/s build-ci/dawn/b build-ci/dawn/p build-ci/dawn/dawn-*.tar.gz.partial
          df -h "$GITHUB_WORKSPACE" | tail -n 1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-steam-frame-arm64-${{ github.sha }}
          restore-keys: ccache-steam-frame-arm64-
      - name: Build
        run: |
          steam-frame/ci-build.sh build
          ccache -s || true
          df -h "$GITHUB_WORKSPACE" | tail -n 1
      - name: Release files and checks
        run: steam-frame/ci-build.sh release
      - name: Verify
        run: |
          cd build-ci/out
          v=${{ steps.version.outputs.version }}
          ls -l
          sha256sum -c SHA256SUMS
          grep -q "\"https://github.com/simplysanatori/PrimedFrame/releases/download/v$v/primedframe-$v-framedrop-linux-arm64.zip\"" primedframe.framedrop.json
          [ "$(tar -xzOf "primedframe-$v-linux-arm64.tar.gz" ./VERSION)" = "$v" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: primedframe-${{ steps.version.outputs.version }}-linux-arm64
          path: |
            build-ci/out/primedframe-${{ steps.version.outputs.version }}-linux-arm64.tar.gz
            build-ci/out/primedframe-${{ steps.version.outputs.version }}-framedrop-linux-arm64.zip
            build-ci/out/primedframe.framedrop.json
            build-ci/out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-logs
          path: build-ci/out/work/*.log
          if-no-files-found: ignore

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: primedframe-${{ needs.build.outputs.version }}-linux-arm64
          path: dist
      - name: Draft release
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          files=("primedframe-$VERSION-linux-arm64.tar.gz" "primedframe-$VERSION-framedrop-linux-arm64.zip" primedframe.framedrop.json SHA256SUMS)
          [ "$(ls | wc -l)" = 4 ] || { ls -l; echo "::error::expected exactly the four release files"; exit 1; }
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }; done
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists: not touching it"; exit 1
          fi
          notes=../CHANGELOG-$VERSION.md
          [ -f "$notes" ] || { echo "::error::no CHANGELOG-$VERSION.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "PrimedFrame $VERSION" --notes-file "$notes" "${files[@]}"
